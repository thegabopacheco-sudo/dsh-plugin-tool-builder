# dsh-plugin-tool-builder — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "toolbuild".
# Tools resultantes: mcp__toolbuild__* (ver README).
- insert:
    - id: mcp-tool-builder
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: toolbuild
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/tool-builder/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
